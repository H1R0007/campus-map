<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
        name="description"
        content="Внутренний инструмент разметки планов кампуса: узлы, рёбра, переходы между этажами"
    />

    <title>Редактор карты кампуса</title>

    <!--
      Никаких внешних ресурсов.

      Стили Leaflet импортируются из npm-пакета в main.tsx: редактор —
      рабочий инструмент команды разметки, и он обязан открываться в
      локальной сети вуза без доступа к публичным CDN.

      Шрифт Inter раньше подгружался с fonts.googleapis.com. Помимо той же
      зависимости от внешнего сервиса это означало передачу IP-адреса
      разметчика третьей стороне на каждом открытии страницы, что для
      развёртывания в ЕС неприемлемо. Используется системный стек шрифтов:
      он одинаков в обоих приложениях и не требует загрузки.
    -->
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
