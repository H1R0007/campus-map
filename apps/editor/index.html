<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
        name="description"
        content="Внутренний инструмент разметки планов кампуса: узлы, рёбра, переходы между этажами"
    />

    <title>Редактор карты кампуса</title>

    <!--
      Значок вкладки встроен в страницу: своего каталога статики у редактора нет
      (`publicDir: false`, запись 4 в DECISIONS.md), и без значка браузер
      запрашивал /favicon.ico и писал в консоль 404. Цвет — акцент темы
      редактора (`--editor-highlight`): переменные CSS внутри значка не работают.
    -->
    <link
        rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23e94560'/%3E%3Cpath d='M12 5a5 5 0 0 0-5 5c0 3.8 5 9 5 9s5-5.2 5-9a5 5 0 0 0-5-5zm0 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4z' fill='white'/%3E%3C/svg%3E"
    />

    <!--
      Никаких внешних ресурсов.

      Стили Leaflet импортируются из npm-пакета в main.tsx: редактор —
      рабочий инструмент команды разметки, и он обязан открываться в
      локальной сети вуза без доступа к публичным CDN.

      Шрифт Inter раньше подгружался с fonts.googleapis.com. Помимо той же
      зависимости от внешнего сервиса это означало передачу IP-адреса
      разметчика третьей стороне на каждом открытии страницы, что для
      развёртывания в ЕС неприемлемо. Используется системный стек шрифтов:
      он одинаков в обоих приложениях и не требует загрузки.
    -->
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
