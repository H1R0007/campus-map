<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <!--
      Масштабирование страницы не запрещено: `user-scalable=no` нарушал
      WCAG 1.4.4 — слабовидящий должен уметь увеличить текст интерфейса.
      Жесты на самой карте забирает Leaflet, а двойной тап по кнопкам не
      масштабирует страницу благодаря `touch-action: manipulation` у body.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Цвет строки браузера: в тёмной теме — фон навигатора (`--color-canvas`). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0063CC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1219" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
        name="description"
        content="Навигатор по корпусам университета: планы этажей и маршруты между аудиториями"
    />

    <title>Навигатор по кампусу</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Leaflet подключается как npm-зависимость (стили импортируются в
      main.tsx), а не с CDN: внешний ресурс не должен быть точкой отказа
      развёрнутого у вуза сервиса, и офлайн-режим PWA при этом работает.

      Манифест и service worker генерирует vite-plugin-pwa — вручную они
      здесь не объявляются, иначе получается двойная регистрация.
    -->
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
