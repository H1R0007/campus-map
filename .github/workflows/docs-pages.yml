name: Документация на GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'tooling/docs-map.mjs'
      - 'tooling/docs-style.mjs'
      - 'tooling/docs-export.mjs'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      # Адрес Pages — подкаталог `/campus-map/`, поэтому база задаётся явно:
      # без неё стили и переходы между страницами уедут в корень домена.
      - name: Сборка документации
        env:
          DOCS_BASE_PATH: /campus-map/
        run: pnpm docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
